privacy_changes_text=Podem actualitzar aquesta política quan canviï el servei o el tractament de dades. La versió vigent i la data d'actualització estaran sempre disponibles en aquesta pàgina.
privacy_changes_title=Canvis en aquesta política
privacy_complaint_text=També tens dret a presentar una reclamació davant l'Agència Espanyola de Protecció de Dades:
privacy_controller_text=La responsable de les dades personals tractades a my-arceus.com és Gemma Becerra. Contacte: ei@my-arceus.com.
privacy_controller_title=Responsable i contacte
privacy_cookies_text=Només utilitzem cookies tècniques pròpies: sessionToken autentica la sessió i lang recorda l'idioma que has triat durant un màxim d'un any. No utilitzem cookies publicitàries ni d'analítica, per això no cal un bàner de consentiment de cookies.
privacy_cookies_title=Cookies
privacy_data_account=Dades del compte i autenticació: correu electrònic, hash de la contrasenya, hash del token de sessió i, si l'accés social està habilitat i el tries, el proveïdor, el seu identificador d'usuari i el correu verificat.
privacy_data_analytics=Analítica de peticions: data, mètode, ruta, noms dels paràmetres de consulta, estat de la resposta, durada, adreça IP, id de l'usuari autenticat quan està disponible, navegador, referència sense paràmetres, idioma, host i tipus de contingut.
privacy_data_ocr=Dades d'OCR: la captura del joc es processa per extreure informació de la Pokédex i no es conserva quan finalitza la petició.
privacy_data_progress=Dades d'ús associades al compte: equip seleccionat i progrés de recerca de la Pokédex desat.
privacy_data_title=Dades que tractem
privacy_last_updated=Última actualització: 30 de juliol de 2026.
privacy_legal_basis_contract=La prestació del compte, l'autenticació, l'equip, el progrés i l'OCR es basa en l'execució del servei que demanes i en les mesures prèvies adoptades a petició teva.
privacy_legal_basis_interest=L'analítica de peticions i els registres tècnics es basen en el nostre interès legítim a protegir el servei, diagnosticar errors, mesurar el rendiment i entendre'n l'ús agregat. Pots oposar-te a aquest tractament.
privacy_legal_basis_title=Base jurídica
privacy_no_automated_decisions=No venem dades personals ni prenem decisions automatitzades que produeixin efectes jurídics o similars significatius.
privacy_policy=Política de privacitat
privacy_purpose_account=Oferir l'autenticació i les funcions del compte: desar el progrés, gestionar un equip i importar progrés amb OCR.
privacy_purpose_analytics=Mantenir el servei segur i fiable, diagnosticar errors, mesurar el rendiment i estudiar de manera agregada com s'utilitza la web.
privacy_purpose_title=Per què utilitzem les dades
privacy_recipients_text=OVHcloud proporciona l'allotjament web i la infraestructura de base de dades i tracta dades per compte nostre. També podem comunicar dades quan ho exigeixi la llei. No les venem ni les cedim amb finalitats publicitàries.
privacy_recipients_title=Proveïdors i comunicacions
privacy_register_notice=Abans de crear el compte, consulta la nostra
privacy_retention_text=Les dades del compte, equip, progrés i identitat OAuth es conserven mentre el compte estigui actiu i s'eliminen quan se suprimeix, tret que una obligació legal n'exigeixi la conservació temporal. L'analítica de peticions en brut, incloses les IP, s'elimina automàticament al cap de 30 dies. Les captures d'OCR no es conserven.
privacy_retention_title=Durant quant de temps conservem les dades
privacy_rights_text=Pots demanar l'accés, rectificació, supressió, portabilitat, limitació o oposar-te al tractament contactant amb
privacy_rights_title=Els teus drets
privacy_security_text=Utilitzem HTTPS, hash de contrasenyes, tokens de sessió amb hash i accés restringit a la infraestructura. Cap servei en línia pot garantir una seguretat absoluta, però apliquem mesures tècniques i organitzatives raonables.
privacy_security_title=Seguretat
privacy_transfers_text=Si l'accés amb Google o Apple està disponible i el tries, aquest proveïdor tractarà les dades necessàries per autenticar-te segons la seva política de privacitat i les garanties aplicables a possibles transferències internacionals.
