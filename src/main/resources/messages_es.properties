privacy_changes_text=Podemos actualizar esta política cuando cambie el servicio o el tratamiento de datos. La versión vigente y su fecha de actualización estarán siempre disponibles en esta página.
privacy_changes_title=Cambios en esta política
privacy_complaint_text=También tienes derecho a presentar una reclamación ante la Agencia Española de Protección de Datos:
privacy_controller_text=La responsable de los datos personales tratados en my-arceus.com es Gemma Becerra. Contacto: ei@my-arceus.com.
privacy_controller_title=Responsable y contacto
privacy_cookies_text=Solo utilizamos cookies técnicas propias: sessionToken autentica la sesión y lang recuerda el idioma que has elegido durante un máximo de un año. No utilizamos cookies publicitarias ni de analítica, por lo que no es necesario un banner de consentimiento de cookies.
privacy_cookies_title=Cookies
privacy_data_account=Datos de cuenta y autenticación: correo electrónico, hash de la contraseña, hash del token de sesión y, si el acceso social está habilitado y lo eliges, el proveedor, su identificador de usuario y el correo verificado.
privacy_data_analytics=Analítica de peticiones: fecha, método, ruta, nombres de los parámetros de consulta, estado de respuesta, duración, dirección IP, id del usuario autenticado cuando está disponible, navegador, referencia sin parámetros, idioma, host y tipos de contenido.
privacy_data_ocr=Datos de OCR: la captura del juego se procesa para extraer información de la Pokédex y no se conserva cuando finaliza la petición.
privacy_data_progress=Datos de uso asociados a la cuenta: equipo seleccionado y progreso de investigación de la Pokédex guardado.
privacy_data_title=Datos que tratamos
privacy_last_updated=Última actualización: 30 de julio de 2026.
privacy_legal_basis_contract=La prestación de la cuenta, autenticación, equipo, progreso y OCR se basa en la ejecución del servicio que solicitas y en las medidas previas adoptadas a petición tuya.
privacy_legal_basis_interest=La analítica de peticiones y los registros técnicos se basan en nuestro interés legítimo en proteger el servicio, diagnosticar fallos, medir el rendimiento y entender su uso agregado. Puedes oponerte a este tratamiento.
privacy_legal_basis_title=Base jurídica
privacy_no_automated_decisions=No vendemos datos personales ni tomamos decisiones automatizadas que produzcan efectos jurídicos o similares significativos.
privacy_policy=Política de privacidad
privacy_purpose_account=Ofrecer autenticación y las funciones de cuenta: guardar el progreso, gestionar un equipo e importar progreso mediante OCR.
privacy_purpose_analytics=Mantener el servicio seguro y fiable, diagnosticar errores, medir el rendimiento y estudiar de forma agregada cómo se utiliza la web.
privacy_purpose_title=Para qué utilizamos los datos
privacy_recipients_text=OVHcloud proporciona el alojamiento web y la infraestructura de base de datos y trata datos por cuenta nuestra. También podremos comunicar datos cuando lo exija la ley. No los vendemos ni cedemos con fines publicitarios.
privacy_recipients_title=Proveedores y comunicaciones
privacy_register_notice=Antes de crear la cuenta, consulta nuestra
privacy_retention_text=Los datos de cuenta, equipo, progreso e identidad OAuth se conservan mientras la cuenta esté activa y se eliminan al suprimirla, salvo que una obligación legal exija conservarlos temporalmente. La analítica de peticiones en bruto, incluidas las IP, se elimina automáticamente después de 30 días. Las capturas de OCR no se conservan.
privacy_retention_title=Durante cuánto tiempo conservamos los datos
privacy_rights_text=Puedes solicitar acceso, rectificación, supresión, portabilidad, limitación u oponerte al tratamiento contactando con
privacy_rights_title=Tus derechos
privacy_security_text=Utilizamos HTTPS, hash de contraseñas, tokens de sesión con hash y acceso restringido a la infraestructura. Ningún servicio en línea puede garantizar una seguridad absoluta, pero aplicamos medidas técnicas y organizativas razonables.
privacy_security_title=Seguridad
privacy_transfers_text=Si el acceso con Google o Apple está disponible y lo eliges, dicho proveedor tratará los datos necesarios para autenticarte conforme a su política de privacidad y las garantías aplicables a posibles transferencias internacionales.
